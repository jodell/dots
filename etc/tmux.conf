# ~/.tmux.conf -- targets tmux >= 2.9 (Ubuntu 20.04+, Debian 11+, Mint,
# Raspberry Pi OS bullseye+, Homebrew). The previous version of this file used
# tmux 1.x syntax (utf8, mode-mouse, status-fg, *-attr, pane-border-fg), all of
# which was removed in tmux 2.1-2.9 -- and it was installed as ~/.tmuxrc, which
# tmux never reads, so none of it had been loading for years.

# --- basics -----------------------------------------------------------------
set -g mode-keys vi
set -g status-keys vi
set -g mouse on
set -g history-limit 50000
set -g base-index 1
setw -g pane-base-index 1
set -sg escape-time 10          # don't swallow <Esc> in vim
set -g focus-events on

# 256 colors everywhere; true color where the outer terminal supports it.
set -g default-terminal "screen-256color"
set -ga terminal-overrides ",*256col*:Tc,xterm-256color:Tc,alacritty:Tc"

# --- splitting and cycling --------------------------------------------------
unbind %
unbind '"'
bind + split-window -h -c "#{pane_current_path}"
bind _ split-window -v -c "#{pane_current_path}"
bind C-j previous-window
bind C-k next-window

# vi-style pane movement
bind h select-pane -L
bind j select-pane -D
bind k select-pane -U
bind l select-pane -R

# --- window titles ----------------------------------------------------------
set -g set-titles on
set -g set-titles-string '#S:#I.#P #W'
setw -g automatic-rename on
set -g renumber-windows on

# --- status bar -------------------------------------------------------------
# Plain ASCII separators on purpose: the old powerline glyphs render as mojibake
# on any terminal without a patched font, which is most servers.
set -g status-interval 15
set -g status-left-length 40
set -g status-right-length 80
set -g status-style fg=white,bg=colour234
set -g window-status-style fg=white,bg=colour234
set -g window-status-current-style fg=colour25,bg=colour39,bold
set -g window-status-activity-style bold
set -g pane-border-style fg=colour245
set -g pane-active-border-style fg=colour39
set -g message-style fg=colour16,bg=colour221,bold

set -g status-left '#[fg=colour235,bg=colour252,bold] #S #[default] '
set -g status-right '#[fg=colour39] #(whoami)@#h #[fg=white]| %H:%M '
set -g window-status-format ' #I #W '
set -g window-status-current-format ' #I #W '

# --- clock ------------------------------------------------------------------
setw -g clock-mode-colour cyan
setw -g clock-mode-style 24

# --- reload -----------------------------------------------------------------
bind r source-file ~/.tmux.conf \; display-message "tmux.conf reloaded"

# Machine-local overrides; missing file is not an error.
if-shell '[ -r ~/.tmux.conf.local ]' 'source-file ~/.tmux.conf.local'
